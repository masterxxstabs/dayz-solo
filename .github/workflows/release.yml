name: Release

# Publishes a release whenever the VERSION file changes on main (or when run by hand).
# Bump VERSION, add its section to CHANGELOG.md and push: this builds the installer and the
# portable zip, creates the vX.Y.Z tag and release, and installed copies offer the update.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 1.2.0 (found '$version')." }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version" -Encoding ascii
          cmd /c "gh release view v$version --repo ${{ github.repository }} >nul 2>&1"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$version is already published - nothing to do."
            Add-Content -Path $env:GITHUB_ENV -Value "ALREADY_PUBLISHED=1" -Encoding ascii
          }
          $global:LASTEXITCODE = 0

      - name: Portable zip
        if: env.ALREADY_PUBLISHED != '1'
        shell: powershell
        run: .\tools\make_release.ps1 -OutDir "$PWD\dist"

      - name: Installer
        if: env.ALREADY_PUBLISHED != '1'
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/O$PWD\dist" installer\DayZSolo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)." }

      - name: Checksums and notes
        if: env.ALREADY_PUBLISHED != '1'
        shell: powershell
        run: |
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          $log = [IO.File]::ReadAllText("$PWD\CHANGELOG.md")
          $match = [regex]::Match($log, "(?ms)^## $([regex]::Escape($env:VERSION))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "DayZ Solo $env:VERSION" }
          [IO.File]::WriteAllText("$PWD\release-notes.md", $notes)
          Get-Content dist\SHA256SUMS.txt

      - name: Publish
        if: env.ALREADY_PUBLISHED != '1'
        shell: bash
        run: gh release create "v${VERSION}" dist/* --target "${GITHUB_SHA}" --title "DayZ Solo ${VERSION}" --notes-file release-notes.md
