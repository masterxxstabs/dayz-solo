name: Release

# Push a tag like v1.2.0 (matching the VERSION file) to build and publish a release.
# The DayZ Solo app finds it within a few hours and offers the update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} doesn't match VERSION ($version)." }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version" -Encoding ascii

      - name: Portable zip
        shell: powershell
        run: .\tools\make_release.ps1 -OutDir "$PWD\dist"

      - name: Installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/O$PWD\dist" installer\DayZSolo.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)." }

      - name: Checksums and notes
        shell: powershell
        run: |
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          $log = [IO.File]::ReadAllText("$PWD\CHANGELOG.md")
          $match = [regex]::Match($log, "(?ms)^## $([regex]::Escape($env:VERSION))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "DayZ Solo $env:VERSION" }
          [IO.File]::WriteAllText("$PWD\release-notes.md", $notes)
          Get-Content dist\SHA256SUMS.txt

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "DayZ Solo ${VERSION}" --notes-file release-notes.md
